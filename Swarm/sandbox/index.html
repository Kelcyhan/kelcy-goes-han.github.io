<!DOCTYPE html>

<head>
    <meta charset="UTF-8" />

    <meta name="description"
        content="Thousand-scale drone 3D swarm behavior simulation system based on Boid algorithm" />
    <title>Drone Swarm Boid Simulation System</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🚁</text></svg>" />
  <script type="module" crossorigin src="./assets/index-DlMvhoyF.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-C07mo_Dh.css">
</head>

<body>
    <div id="app"></div>
    <script>
        (() => {
            const root = document.getElementById('app');
            let stableSince = 0;
            function reportReady() {
                if (!root?.children.length) {
                    stableSince = 0;
                    return window.setTimeout(reportReady, 60);
                }
                if (!stableSince) stableSince = Date.now();
                if (Date.now() - stableSince < 900) return window.setTimeout(reportReady, 60);
                if (window.parent !== window) {
                    window.parent.postMessage({
                        source: 'kelcy-demo', version: 1, demo: 'swarm', type: 'ready'
                    }, window.location.origin);
                }
            }
            reportReady();
        })();
    </script>
</body>

</html>
