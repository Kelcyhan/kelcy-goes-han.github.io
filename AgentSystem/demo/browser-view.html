<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
#screen { width: 100%; height: 100%; }
#status {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #888;
  font-family: system-ui, sans-serif;
  font-size: 13px;
  pointer-events: none;
}
</style>
</head>
<body>
<div id="screen"></div>
<div id="status">Connecting…</div>
<script type="module">
import RFB from '/vnc/core/rfb.js';

const status = document.getElementById('status');

function connect() {
  status.textContent = 'Connecting…';
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${protocol}//${window.location.host}/vnc/`;

  const rfb = new RFB(document.getElementById('screen'), url, { credentials: {} });
  rfb.scaleViewport = true;
  rfb.background = '#111111';

  rfb.addEventListener('connect', () => { status.textContent = ''; });
  rfb.addEventListener('disconnect', (e) => {
    status.textContent = e.detail?.clean ? 'Disconnected' : 'Connection lost — retrying…';
    setTimeout(connect, 3000);
  });
  rfb.addEventListener('credentialsrequired', () => {
    rfb.sendCredentials({ password: '' });
  });
}

connect();
</script>
</body>
</html>
