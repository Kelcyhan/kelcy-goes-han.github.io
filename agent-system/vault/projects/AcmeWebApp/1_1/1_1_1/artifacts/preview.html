<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Design Tokens Preview — Acme</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  body {
    font-family: var(--font-sans);
    background: var(--color-brand-neutral-50);
    color: var(--color-brand-neutral-800);
    margin: 0;
    padding: var(--space-8);
  }
  h1 { font-size: 32px; margin-top: 0; }
  h2 { font-size: 20px; margin-top: var(--space-8); border-bottom: 1px solid var(--color-brand-neutral-200); padding-bottom: var(--space-2); }
  .row { display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .swatch {
    width: 88px; height: 88px;
    border-radius: var(--radius-md);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.04);
    display: flex; align-items: flex-end; padding: var(--space-2);
    font-size: 11px; font-family: var(--font-mono);
    color: white; text-shadow: 0 1px 0 rgba(0,0,0,.4);
  }
  .button {
    font-family: var(--font-sans);
    font-size: 14px;
    padding: var(--space-2) var(--space-4);
    border-radius: var(--radius-md);
    border: 0;
    background: var(--color-brand-primary-500);
    color: white;
    cursor: pointer;
  }
  .button.secondary { background: var(--color-brand-neutral-200); color: var(--color-brand-neutral-800); }
  .button.danger    { background: var(--color-danger); }
  .input {
    font-family: var(--font-sans);
    font-size: 14px;
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-md);
    border: 1px solid var(--color-brand-neutral-200);
    background: white;
  }
</style>
</head>
<body>
  <h1>Design Tokens — Preview</h1>

  <h2>Brand Primary</h2>
  <div class="row">
    <div class="swatch" style="background: var(--color-brand-primary-50)"   ></div>
    <div class="swatch" style="background: var(--color-brand-primary-100)"  ></div>
    <div class="swatch" style="background: var(--color-brand-primary-300)"  >300</div>
    <div class="swatch" style="background: var(--color-brand-primary-500)"  >500</div>
    <div class="swatch" style="background: var(--color-brand-primary-700)"  >700</div>
    <div class="swatch" style="background: var(--color-brand-primary-900)"  >900</div>
  </div>

  <h2>Buttons</h2>
  <div class="row">
    <button class="button">Primary</button>
    <button class="button secondary">Secondary</button>
    <button class="button danger">Danger</button>
  </div>

  <h2>Inputs</h2>
  <div class="row">
    <input class="input" placeholder="Default input" />
    <input class="input" value="With value" />
  </div>
</body>
</html>
