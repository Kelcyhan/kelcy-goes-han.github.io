<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Visual Diff Mockup</title>
<style>
  body { font-family: system-ui; background: #f8fafc; margin: 0; padding: 24px; color: #1e293b; }
  h1 { margin: 0 0 16px; font-size: 22px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .card {
    background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .route { font-family: ui-monospace, monospace; font-size: 13px; color: #475569; margin-bottom: 12px; }
  .pair { display: flex; gap: 8px; align-items: stretch; height: 100px; }
  .pair > div { flex: 1; border-radius: 6px; }
  .before { background: linear-gradient(135deg, #cbd5e1, #94a3b8); }
  .after  { background: linear-gradient(135deg, #93c5fd, #3b82f6); }
  .delta {
    margin-top: 12px; font-size: 12px; color: #b91c1c;
  }
  .delta.ok { color: #15803d; }
</style>
</head>
<body>
  <h1>Visual Diff — last run</h1>
  <div class="grid">
    <div class="card">
      <div class="route">/dashboard</div>
      <div class="pair"><div class="before"></div><div class="after"></div></div>
      <div class="delta">Δ 2.4% — review</div>
    </div>
    <div class="card">
      <div class="route">/dashboard/settings</div>
      <div class="pair"><div class="before"></div><div class="after"></div></div>
      <div class="delta ok">Δ 0.1% — within budget</div>
    </div>
    <div class="card">
      <div class="route">/billing</div>
      <div class="pair"><div class="before"></div><div class="after"></div></div>
      <div class="delta ok">Δ 0.0%</div>
    </div>
    <div class="card">
      <div class="route">/profile</div>
      <div class="pair"><div class="before"></div><div class="after"></div></div>
      <div class="delta">Δ 5.8% — review</div>
    </div>
  </div>
</body>
</html>
